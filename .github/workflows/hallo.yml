name: hallo
on:
  workflow_dispatch:
    inputs:
      gruss:
        description: Womit begrüßen?
        default: Hallo

jobs:
  info:
    runs-on: ubuntu-24.04
    outputs:
      kurz: ${{ steps.sha.outputs.kurz }}
    steps:
      - name: Kurzen Commit ermitteln
        id: sha
        run: echo "kurz=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Im selben Job lesen
        run: echo "Step-Output ${{ steps.sha.outputs.kurz }}"

  zeigen:
    needs: info
    runs-on: ubuntu-24.04
    steps:
      - name: Im nächsten Job lesen
        run: |
          echo "Job-Output ${{ needs.info.outputs.kurz }}"
          echo "### Gebaut aus ${{ needs.info.outputs.kurz }}" >> "$GITHUB_STEP_SUMMARY"
