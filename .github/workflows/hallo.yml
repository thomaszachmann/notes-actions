name: hallo
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      gruss:
        description: Womit begrüßen?
        default: Hallo

jobs:
  info:
    runs-on: ubuntu-24.04
    outputs:
      kurz: ${{ steps.sha.outputs.kurz }}
    steps:
      - name: Kurzen Commit ermitteln
        id: sha
        run: echo "kurz=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Im selben Job lesen
        env:
          KURZ: ${{ steps.sha.outputs.kurz }}
        run: echo "Step-Output $KURZ"

  zeigen:
    needs: info
    runs-on: ubuntu-24.04
    steps:
      - name: Im nächsten Job lesen
        env:
          KURZ: ${{ needs.info.outputs.kurz }}
        run: |
          echo "Job-Output $KURZ"
          echo "### Gebaut aus $KURZ" >> "$GITHUB_STEP_SUMMARY"
