name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        goarch: [amd64, arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Bauen
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: >-
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}"
          -o notes-api-linux-$GOARCH .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes-api-linux-${{ matrix.goarch }}
          path: notes-api-linux-${{ matrix.goarch }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: notes-api-linux-*
          merge-multiple: true
      - name: Prüfsummen
        run: sha256sum notes-api-linux-* > SHA256SUMS
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          VORAB: ${{ contains(github.ref_name, '-') }}
        run: >-
          gh release create "$GITHUB_REF_NAME" notes-api-linux-* SHA256SUMS
          --repo "$GITHUB_REPOSITORY" --generate-notes --prerelease="$VORAB"

  deploy:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Deployment anstoßen
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY"
          -f version="${GITHUB_REF_NAME#v}"
