name: ci
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Architektur
        run: go env GOARCH
      - name: Statische Prüfung
        run: go vet ./...
      - run: go test ./...
      - name: PR-Info
        if: github.event_name == 'pull_request'
        env:
          VON: ${{ github.head_ref }}
          NACH: ${{ github.base_ref }}
        run: echo "PR $VON -> $NACH" | tee -a "$GITHUB_STEP_SUMMARY"
