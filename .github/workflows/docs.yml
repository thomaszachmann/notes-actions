name: docs
on:
  push:
    branches: [main]
    paths: ['**.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: grep -q notes-actions README.md
      - run: echo "Doku ok" >> "$GITHUB_STEP_SUMMARY"
