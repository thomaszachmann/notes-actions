name: wk
on: workflow_dispatch
permissions:
  contents: read
jobs:
  r3:
    runs-on: ubuntu-24.04
    steps:
      - id: v
        run: echo "version=1.2.3" >> "$GITHUB_OUTPUT"
      - env:
          VERSION: ${{ steps.v.outputs.versoin }}
        run: |
          echo "Version ist '$VERSION'"
          test -n "$VERSION"
