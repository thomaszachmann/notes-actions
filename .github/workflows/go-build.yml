name: go-build
on:
  workflow_call:
    inputs:
      version:
        description: Wert für main.version
        type: string
        required: true
      cache:
        type: boolean
        default: true
    outputs:
      artefakte:
        description: Namen der hochgeladenen Artefakte
        value: notes-api-linux-amd64 notes-api-linux-arm64

permissions:
  contents: read

jobs:
  bauen:
    strategy:
      matrix:
        goarch: [amd64, arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-setup
        with:
          cache: ${{ inputs.cache }}
      - name: Bauen
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ inputs.version }}
        run: >-
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION#v}"
          -o notes-api-linux-$GOARCH .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes-api-linux-${{ matrix.goarch }}
          path: notes-api-linux-${{ matrix.goarch }}
          retention-days: 7
