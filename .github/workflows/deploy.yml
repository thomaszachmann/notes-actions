name: deploy
on:
  workflow_dispatch:
    inputs:
      version:
        description: Image-Tag, z. B. 0.5.1
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-produktion
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, lab]
    environment:
      name: produktion
      url: http://localhost:30081/version
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/notes-api:${{ inputs.version }}
    steps:
      - name: Version setzen
        run: kubectl -n notes set image deployment/notes-api notes-api="$IMAGE"
      - name: Rollout abwarten
        run: kubectl -n notes rollout status deployment/notes-api --timeout=60s
      - name: Antwortet die neue Version?
        uses: thomaszachmann/notes-actions/.github/actions/healthcheck@v0.6.0-rc.4
        with:
          url: http://localhost:30081/version
          erwartet: ${{ inputs.version }}
      - name: Zurückrollen
        if: failure()
        run: kubectl -n notes rollout undo deployment/notes-api
