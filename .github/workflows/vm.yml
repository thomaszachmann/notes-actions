name: vm
permissions:
  contents: read
on: workflow_dispatch

jobs:
  wo:
    runs-on: arc-notes
    steps:
      - name: Wo bin ich?
        run: |
          echo "Host: $(hostname), Benutzer: $(whoami)"
          echo "Arbeitsordner: $PWD"
      - name: Spuren hinterlassen
        run: |
          mkdir -p ~/gha-lab
          echo "Lauf $GITHUB_RUN_ID" >> ~/gha-lab/laeufe.txt
          cat ~/gha-lab/laeufe.txt
