apiVersion: v1
kind: Namespace
metadata:
  name: notes
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-api
  namespace: notes
spec:
  replicas: 2
  selector:
    matchLabels: {app: notes-api}
  template:
    metadata:
      labels: {app: notes-api}
    spec:
      containers:
        - name: notes-api
          image: ghcr.io/thomaszachmann/notes-api:0.5.0
          ports: [{containerPort: 8080}]
          env:
            - name: NOTES_API_KEY
              valueFrom:
                secretKeyRef: {name: notes-api, key: api-key}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: notes-api
  namespace: notes
spec:
  type: NodePort
  selector: {app: notes-api}
  ports: [{port: 8080, nodePort: 30081}]
